# ====== 微服务版 Nginx 配置 ======
# 按路径前缀路由到 6 个微服务进程 + 前端静态文件
#
# 服务端口：
#   auth_service  :8001  认证 / 登录设备 / 密保
#   user_service  :8002  资料 / 头像 / 课表
#   chat_service  :8003  聊天 / 会话 / Agent
#   kb_service    :8004  知识库
#   admin_service :8005  管理员 / 数据看板
#   file_service  :8006  文件上传下载

upstream auth_svc  { server 127.0.0.1:8001; }
upstream user_svc  { server 127.0.0.1:8002; }
upstream chat_svc  { server 127.0.0.1:8003; }
upstream kb_svc    { server 127.0.0.1:8004; }
upstream admin_svc { server 127.0.0.1:8005; }
upstream file_svc  { server 127.0.0.1:8006; }

server {
    listen 80;
    server_name _;   # 修改为你的域名或服务器 IP

    # 前端静态文件根目录
    root /var/www/lc-course-frontend;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ==================== auth_service (:8001) ====================
    location ~ ^/api/auth/ {
        proxy_pass http://auth_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    # 密码 / 密保 / 登录设备 归 auth_service
    location ~ ^/api/user/(password|security-question|devices) {
        proxy_pass http://auth_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== user_service (:8002) ====================
    # 资料 / 头像 / 课表 / 注销 归 user_service
    location ~ ^/api/user/(profile|avatar|schedule|account) {
        proxy_pass http://user_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/avatars/ {
        proxy_pass http://user_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/schedules/ {
        proxy_pass http://user_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== chat_service (:8003) ====================
    location /api/chat {
        proxy_pass http://chat_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/conversations {
        proxy_pass http://chat_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/feedback {
        proxy_pass http://chat_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/tasks/ {
        proxy_pass http://chat_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== kb_service (:8004) ====================
    location /api/admin/kb/ {
        proxy_pass http://kb_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/kb/ {
        proxy_pass http://kb_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== admin_service (:8005) ====================
    location /api/admin/users {
        proxy_pass http://admin_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/admin/stats/ {
        proxy_pass http://admin_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== file_service (:8006) ====================
    location /api/upload-word {
        proxy_pass http://file_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
    location /api/download/ {
        proxy_pass http://file_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }

    # ==================== 健康检查 ====================
    # 所有服务都有 /api/health，统一打到 auth_service
    location /api/health {
        proxy_pass http://auth_svc;
        include /etc/nginx/snippets/microservice_proxy.conf;
    }
}

# SSE / 长连接 / 通用代理头 片段文件需放在：
# /etc/nginx/snippets/microservice_proxy.conf
# 内容：
#   proxy_http_version 1.1;
#   proxy_set_header Upgrade $http_upgrade;
#   proxy_set_header Connection "upgrade";
#   proxy_set_header Host $host;
#   proxy_set_header X-Real-IP $remote_addr;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_buffering off;
#   proxy_cache off;
#   proxy_read_timeout 3600s;
#   proxy_send_timeout 3600s;
#   chunked_transfer_encoding on;
